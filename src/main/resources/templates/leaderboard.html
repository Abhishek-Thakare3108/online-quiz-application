<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Leaderboard - Online Quiz App</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
    <style>
        body { background: #f0f2f5; font-family: Arial, sans-serif; }
        .navbar-custom { background: #4CAF50; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .navbar-custom span { color: white; font-size: 18px; font-weight: bold; }
        .navbar-custom a { color: white; text-decoration: none; margin-left: 15px; font-size: 15px; }
        .navbar-custom a:hover { text-decoration: underline; }
        .rank-1 { background: #fff8e1; font-weight: bold; }
        .rank-2 { background: #f5f5f5; }
        .rank-3 { background: #fbe9e7; }
        .medal { font-size: 20px; }
    </style>
</head>
<body>

<div class="navbar-custom">
    <span>🏆 Leaderboard</span>
    <div>
        <a th:href="@{/dashboard}">🏠 Dashboard</a>
        <a th:href="@{/progress}">📊 My Progress</a>
        <a th:href="@{/logout}">Logout</a>
    </div>
</div>

<div class="container">
    <div class="card shadow-sm">
        <div class="card-body">
            <h4 class="mb-1">🏆 Top 10 Scores</h4>
            <p class="text-muted mb-4">The highest scoring quiz attempts across all users.</p>

            <div th:if="${#lists.isEmpty(results)}" class="alert alert-info">
                No quiz attempts yet. Be the first to take a quiz!
            </div>

            <div class="table-responsive" th:unless="${#lists.isEmpty(results)}">
                <table class="table table-bordered table-hover align-middle">
                    <thead class="table-dark">
                        <tr>
                            <th>Rank</th>
                            <th>User</th>
                            <th>Quiz</th>
                            <th>Score</th>
                            <th>Total Questions</th>
                            <th>Percentage</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="result, stat : ${results}"
                            th:class="${stat.index == 0} ? 'rank-1' : (${stat.index == 1} ? 'rank-2' : (${stat.index == 2} ? 'rank-3' : ''))">

                            <!-- Rank with medal for top 3 -->
                            <td>
                                <span th:if="${stat.index == 0}" class="medal">🥇</span>
                                <span th:if="${stat.index == 1}" class="medal">🥈</span>
                                <span th:if="${stat.index == 2}" class="medal">🥉</span>
                                <span th:if="${stat.index >= 3}" th:text="${stat.index + 1}">4</span>
                            </td>

                            <td th:text="${result.user.username}">Username</td>
                            <td th:text="${result.quiz.title}">Quiz Title</td>
                            <td><strong th:text="${result.score}">0</strong></td>
                            <td th:text="${result.totalQuestions}">0</td>

                            <!-- Percentage with colour badge -->
                            <td>
                                <span th:with="pct=${#numbers.formatDecimal(result.score * 100.0 / result.totalQuestions, 1, 0)}"
                                      th:classappend="${result.score * 100 / result.totalQuestions >= 70} ? 'badge bg-success' : (${result.score * 100 / result.totalQuestions >= 40} ? 'badge bg-warning text-dark' : 'badge bg-danger')"
                                      th:text="${pct} + '%'">0%</span>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
